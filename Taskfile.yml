version: "3"

tasks:
  dev:
    desc: Serve the site locally with live reload
    cmds:
      - live-server .

  serve:
    desc: Plain static server (no live reload) on :8912
    cmds:
      - python3 -m http.server 8912

  check:
    desc: Sanity-check links, assets and cache-busting
    cmds:
      - node scripts/check.mjs

  deploy:prod:
    desc: Deploy the site to Cloudflare Pages
    cmds:
      - wrangler pages deploy . --project-name worotyns

  cache-bust:
    desc: Rewrite the ?v= hash on the stylesheet and the og image after editing or regenerating them
    cmds:
      - |
        set -e
        V=$(shasum -a 1 styles.css | cut -c1-8)
        O=$(shasum -a 1 ogimage.jpg | cut -c1-8)
        for f in index.html 404.html; do
          perl -pi -e "s|/styles\.css(\?v=[a-f0-9]+)?|/styles.css?v=$V|g; s|ogimage\.jpg(\?v=[a-f0-9]+)?|ogimage.jpg?v=$O|g" "$f"
        done
        echo "✅ styles?v=$V og?v=$O"

  generate:og-image:
    desc: Screenshot the page into a 1200x630 og image, then cache-bust
    cmds:
      - |
        set -e
        CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        # a fixed port once left a stale server from another directory answering;
        # ask the OS for a free one
        PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()")
        python3 -m http.server "$PORT" --bind 127.0.0.1 >/dev/null 2>&1 &
        SERVER=$!
        trap 'kill $SERVER 2>/dev/null || true' EXIT
        sleep 1
        curl -sf -o /dev/null "http://127.0.0.1:$PORT/" || { echo "server on $PORT did not answer"; exit 1; }
        "$CHROME" --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=6000 \
          --blink-settings=preferredColorScheme=1 \
          --screenshot=ogimage.png --window-size=1200,630 "http://127.0.0.1:$PORT/"
        sips -s format jpeg -s formatOptions 88 ogimage.png --out ogimage.jpg >/dev/null
        rm -f ogimage.png
      - task: cache-bust
