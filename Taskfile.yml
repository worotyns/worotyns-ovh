version: "3"

tasks:
  dev:
    desc: Serve the site locally with live reload
    cmds:
      - live-server .

  serve:
    desc: Plain static server (no live reload) on :8912
    cmds:
      - python3 -m http.server 8912

  check:
    desc: Sanity-check the data files and HTML basics
    cmds:
      - node scripts/check.mjs

  deploy:prod:
    desc: Deploy the site to Cloudflare Pages
    cmds:
      - wrangler pages deploy . --project-name worotyns

  cache-bust:
    desc: Rewrite the ?v= hash on every stylesheet reference after editing CSS
    cmds:
      - |
        set -e
        V=$(shasum -a 1 styles.css | cut -c1-8)
        B=$(shasum -a 1 vendor/blocks.min.css | cut -c1-8)
        R=$(shasum -a 1 vendor/reset.min.css | cut -c1-8)
        for f in index.html 404.html fractional-cto/index.html product-leadership/index.html; do
          perl -pi -e "s|/vendor/reset\.min\.css(\?v=[a-f0-9]+)?|/vendor/reset.min.css?v=$R|g; s|/vendor/blocks\.min\.css(\?v=[a-f0-9]+)?|/vendor/blocks.min.css?v=$B|g; s|/styles\.css(\?v=[a-f0-9]+)?|/styles.css?v=$V|g" "$f"
        done
        echo "✅ styles.css?v=$V blocks?v=$B reset?v=$R"

  generate:og-image:
    desc: Screenshot every page into a 1200x630 og image (needs a local server, the pages use absolute paths)
    cmds:
      - |
        set -e
        CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
        python3 -m http.server 8899 --bind 127.0.0.1 >/dev/null 2>&1 &
        SERVER=$!
        trap 'kill $SERVER 2>/dev/null || true' EXIT
        sleep 1
        shot() {
          "$CHROME" --headless=new --disable-gpu --hide-scrollbars \
            --virtual-time-budget=6000 \
            --screenshot="$2" --window-size=1200,630 \
            "http://127.0.0.1:8899/$1"
          sips -s format jpeg -s formatOptions 88 "$2" --out "${2%.png}.jpg" >/dev/null
          rm -f "$2"
        }
        shot "" ogimage.png
        shot fractional-cto/ og-fractional-cto.png
        shot product-leadership/ og-product-leadership.png
        echo "✅ og images regenerated (3)"
