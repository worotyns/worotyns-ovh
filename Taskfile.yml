version: "3"

tasks:
  dev:
    desc: Serve the site locally with live reload
    cmds:
      - live-server .

  serve:
    desc: Plain static server (no live reload) on :8912
    cmds:
      - python3 -m http.server 8912

  check:
    desc: Sanity-check the data files and HTML basics
    cmds:
      - node scripts/check.mjs

  deploy:prod:
    desc: Deploy the site to Cloudflare Pages
    cmds:
      - wrangler pages deploy . --project-name worotyns

  generate:og-image:
    desc: Screenshot index.html → ogimage.jpg (1200×630)
    cmds:
      - >-
        /Applications/Google\ Chrome.app/Contents/MacOS/Google\ Chrome
        --headless=new --disable-gpu --hide-scrollbars
        --virtual-time-budget=6000
        --screenshot=ogimage.png
        --window-size=1200,630
        --default-background-color=000000
        "file://$(pwd)/index.html?track=tech"
      - sips -s format jpeg -s formatOptions 88 ogimage.png --out ogimage.jpg
      - rm -f ogimage.png
      - echo "✅ ogimage.jpg regenerated"
